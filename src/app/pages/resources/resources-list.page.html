<div class="page-heading reveal reveal-one">
    <p class="eyebrow">S’informer</p>
    <h1>Ressources juridiques</h1>
    <p>Des réponses claires et accessibles pour mieux comprendre vos droits.</p>
</div>
<div class="search-row reveal reveal-two"><label class="search-box"><span>⌕</span><input [(ngModel)]="search"
            placeholder="Rechercher une question, un thème..." /></label><button class="filter-button">Toutes les
        catégories <span>⌄</span></button></div>
<div class="category-strip reveal reveal-two"><button class="category-pill selected">Tout</button><button
        class="category-pill">Travail</button><button class="category-pill">Logement</button><button
        class="category-pill">Famille</button><button class="category-pill">Consommation</button></div>
<div class="resource-grid reveal reveal-three">@for (resource of filtered; track resource.title) {<article
        class="resource-card">
        <div class="resource-top"><span class="resource-icon" [class]="resource.color">▤</span><span
                class="read-time">{{ resource.readTime }} de lecture</span></div><span class="resource-category">{{
            resource.category }}</span>
        <h2>{{ resource.title }}</h2>
        <p>{{ resource.description }}</p><button class="text-button" type="button" (click)="open(resource)">Lire la suite <span>→</span></button>
    </article>}</div>
