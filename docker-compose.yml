services:
  mysql:
    image: mysql:8.0
    container_name: droit-accessible-mysql
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: droit_accessible
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: calvin
      MYSQL_PASSWORD: calvin123
    ports:
      - "3306:3306"
    volumes:
      - droit_accessible_data:/var/lib/mysql

volumes:
  droit_accessible_data:
