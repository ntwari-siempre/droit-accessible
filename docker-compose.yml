services:
  postgres:
    image: postgres:16-alpine
    container_name: droit-accessible-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: droit_accessible
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - droit_accessible_data:/var/lib/postgresql/data

volumes:
  droit_accessible_data:
