# Déploiement gratuit Render.com : un seul service Node sert l'API Express
# ET le frontend Angular compilé (voir server/index.ts, section "Servir le
# frontend Angular en production"). La base PostgreSQL gratuite est à créer
# chez Neon.tech (sans expiration), puis renseignée comme variable secrète.
services:
  - type: web
    name: droit-accessible
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run server
    healthCheckPath: /api/health
    envVars:
      # À renseigner lors du déploiement : URL Neon (postgresql://...?sslmode=require)
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_VERSION
        value: "22"
      # SMTP (envoi d'e-mails au demandeur) : a renseigner pour activer
      # l'envoi reel. Sans ces variables, l'API repond 503 et le bouton
      # « Contacter par e-mail » bascule sur un mailto:.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      # Envoi d'e-mails sans SMTP : une seule cle suffit.
      - key: FORMSPREE_URL
        sync: false
      - key: WEB3FORMS_KEY
        sync: false